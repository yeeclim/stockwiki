name: Fetch KRX Data Daily

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 00:00 UTC (한국 시간 09:00)
  workflow_dispatch:     # GitHub UI에서 수동 실행도 허용

jobs:
  fetch-krx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: stockwiki

      - name: Run fetch-krx script
        run: node scripts/fetch-krx.js
        working-directory: stockwiki

      - name: Commit updated data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/krx_filtered_data.json
          git commit -m "📈 Update KRX data [auto]" || echo "No changes"
          git push
        working-directory: stockwiki
