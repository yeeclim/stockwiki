name: stockwiki
description: A new Flutter project.

publish_to: 'none' # Remove this line if you want to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  fl_chart: 1.1.0
  intl: ^0.20.2
  provider: ^6.1.2
  supabase_flutter: ^2.8.0
  gotrue: any
  web: ^1.1.1
  k_chart_plus:
    path: lib/vendor/k_chart_plus

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # 🔽 필요시 여기에 다른 asset 파일 추가 가능

  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-VariableFont_wght.ttf
