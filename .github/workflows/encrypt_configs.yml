name: trading_configs 암호화 마이그레이션

# 수동 실행 전용. trading_configs 의 평문 민감 필드를 AES-256-GCM 으로 올린다.
#
# 여기서 도는 이유: SUPABASE_SERVICE_ROLE_KEY 와 TRADING_ENC_KEY 가 이미 둘 다
# 이 저장소의 Secrets 에 있다. 로컬에서 돌리려면 두 키를 개발 PC 로 꺼내와야
# 하는데, 자격증명을 보호하려고 하는 작업에서 자격증명을 더 퍼뜨리는 셈이 된다.
#
# 스크립트는 멱등하다(이미 enc:v1: 인 값은 건너뜀). 나중에 키를 교체할 때도
# 같은 방식으로 쓸 수 있어 남겨 둔다.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '변경 없이 대상만 확인 (권장: 먼저 true 로 한 번)'
        type: boolean
        default: true

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: trading/requirements.txt

      - name: Install dependencies
        run: pip install -r trading/requirements.txt

      - name: Encrypt trading_configs
        working-directory: trading
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_ENC_KEY:           ${{ secrets.TRADING_ENC_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python encrypt_existing_configs.py --dry-run
          else
            python encrypt_existing_configs.py
          fi
