name: 종목 스크리닝

on:
  schedule:
    # 평일 KST 06:30 = UTC 21:30 (전날) — GitHub Actions 최대 1시간 지연 감안, 08:00 프리장 전 완료 목표
    - cron: '30 21 * * 0-4'
    # 평일 KST 15:00 = UTC 06:00
    - cron: '0 6 * * 1-5'
  workflow_dispatch:  # 수동 실행

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: trading/requirements.txt

      - name: 패키지 설치
        run: pip install -r trading/requirements.txt

      - name: 종목 스크리닝 실행
        env:
          KIS_APP_KEY:               ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:            ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:            ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_PROD_CODE:     ${{ secrets.KIS_ACCOUNT_PROD_CODE }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_SENDER:              ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:            ${{ secrets.EMAIL_PASSWORD }}
          KAKAO_REST_API_KEY:        ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN:       ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET:       ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: |
          cd trading
          python screen.py
