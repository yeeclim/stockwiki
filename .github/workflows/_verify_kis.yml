name: (임시) KIS 리팩터 검증

# Phase 3 KIS API 통합 검증용 일회성 워크플로우. 검증 후 삭제.
on:
  workflow_dispatch:
  push:
    branches:
      - cleanup/phase3-dedup
    paths:
      - trading/kis_api.py
      - trading/brokers/kis_api.py
      - trading/_verify_kis.py
      - .github/workflows/_verify_kis.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: trading/requirements.txt

      - name: 패키지 설치
        run: pip install -r trading/requirements.txt

      - name: KIS 검증 (읽기 전용, 알림/주문 없음)
        env:
          KIS_APP_KEY:           ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:        ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:        ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_PROD_CODE: ${{ secrets.KIS_ACCOUNT_PROD_CODE }}
          DART_API_KEY:          ${{ secrets.DART_API_KEY }}
        run: |
          cd trading
          python _verify_kis.py
