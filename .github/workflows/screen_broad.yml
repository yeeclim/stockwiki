name: 광역 종목 스캔 (전체 KOSPI/KOSDAQ)

on:
  # GitHub schedule 은 2~4시간 지연·누락이 잦아 사용 안 함 — cron-job.org 가 workflow_dispatch 호출.
  # 호출: 매일 KST 06:00 — 06:30 스크리닝이 이 결과(screening_candidates)를 읽으므로 반드시 그 전에.
  workflow_dispatch:

jobs:
  broad-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: trading/requirements.txt

      - name: 패키지 설치
        run: pip install -r trading/requirements.txt

      - name: 광역 종목 스캔 실행
        env:
          KIS_APP_KEY:               ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:            ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:            ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_PROD_CODE:     ${{ secrets.KIS_ACCOUNT_PROD_CODE }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DART_API_KEY:              ${{ secrets.DART_API_KEY }}
        run: |
          cd trading
          python screen_broad.py
