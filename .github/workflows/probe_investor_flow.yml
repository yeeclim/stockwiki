name: KIS 투자자 수급 원본 확인

# 조회만 하는 격리 워크플로 — 메일·DB 쓰기·주문 없음. 확인이 끝나면 지운다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: trading/requirements.txt

      - name: 패키지 설치
        run: pip install -r trading/requirements.txt

      - name: 투자자 수급 원본 조회
        env:
          KIS_APP_KEY:           ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:        ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:        ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_PROD_CODE: ${{ secrets.KIS_ACCOUNT_PROD_CODE }}
        run: |
          cd trading
          python probe_investor_flow.py
