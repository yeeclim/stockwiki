name: 미국 광역 종목 스캔 (전체 NASDAQ/NYSE/AMEX)

on:
  # GitHub schedule 은 2~4시간 지연·누락이 잦아 사용 안 함 — cron-job.org 가 workflow_dispatch 호출.
  # 호출: 매일 KST 07:00 (미국 장 마감 후)
  workflow_dispatch:

jobs:
  broad-scan-us:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: trading/requirements.txt

      - name: 패키지 설치
        run: pip install -r trading/requirements.txt

      - name: 미국 광역 종목 스캔 실행
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd trading
          python screen_us_broad.py
