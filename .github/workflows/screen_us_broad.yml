name: 미국 광역 종목 스캔 (전체 NASDAQ/NYSE/AMEX)

on:
  schedule:
    # 미국 장 마감 후 매일 실행 — KST 07:00 = UTC 전날 22:00 (국내 광역 스캔과 동일 시각대)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  broad-scan-us:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: trading/requirements.txt

      - name: 패키지 설치
        run: pip install -r trading/requirements.txt

      - name: 미국 광역 종목 스캔 실행
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd trading
          python screen_us_broad.py
