name: 야간선물 과거치 탐색

# 조회만 하는 격리 워크플로우 — 메일 발송·DB 쓰기·주문 없음.
# 코스피200 야간선물 일봉 과거치를 KIS 에서 받을 수 있는지 확인한다(갭 예측력 검증용).
# 답이 나오면 이 워크플로우는 지울 것 (임시 탐색용).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: trading/requirements.txt

      - name: 패키지 설치
        run: pip install -r trading/requirements.txt

      - name: 야간선물 일봉 조회
        env:
          KIS_APP_KEY:           ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:        ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:        ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_PROD_CODE: ${{ secrets.KIS_ACCOUNT_PROD_CODE }}
        run: |
          cd trading
          python probe_night_history.py | tail -3

      - name: 실데이터 판정 확인 (메일 없음)
        env:
          KIS_APP_KEY:           ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:        ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:        ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_PROD_CODE: ${{ secrets.KIS_ACCOUNT_PROD_CODE }}
        run: |
          cd trading
          python -c "
          from kis_api import KISApi
          import us_market_brief as u
          api = KISApi(); api.auth()
          b = u.get_brief(api, with_summary=False)
          print(u.render_text(b)[:600])
          "
