name: KIS 야간선물 탐색

# 조회만 하는 격리 워크플로우다. 메일 발송·DB 쓰기·주문이 전부 없어서
# 실계좌 자격증명으로 반복 실행해도 바깥으로 나가는 게 없다.
#
# 야간시장은 18:00~05:00 KST 에 열린다. 두 시각에 돌려서 두 가지를 각각 본다.
#   1) 야간장 한복판 — 애초에 응답하는 조합이 있는가
#   2) 아침 메일 직전 — 마감된 야간장의 종가가 그때까지 남아있는가
# 2번이 핵심이다. 장중에만 응답하고 마감 후 사라지면 06:30 메일엔 못 쓴다.
#
# 답이 나오면 이 워크플로우는 지울 것 (임시 탐색용).
on:
  schedule:
    # 야간장 한복판: KST 21:00 = UTC 12:00 (평일)
    - cron: '0 12 * * 1-5'
    # 아침 메일(06:30) 직전: KST 06:20 = UTC 21:20 (전날)
    - cron: '20 21 * * 0-4'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: trading/requirements.txt

      - name: 패키지 설치
        run: pip install -r trading/requirements.txt

      - name: 야간선물 조회 경로 탐색
        env:
          KIS_APP_KEY:           ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:        ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:        ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_PROD_CODE: ${{ secrets.KIS_ACCOUNT_PROD_CODE }}
        run: |
          cd trading
          python probe_night_futures.py
