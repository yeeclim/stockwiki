name: Build and Deploy to Vercel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.7'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Run static analysis
      run: flutter analyze --no-fatal-infos

    - name: Check formatting
      run: dart format --set-exit-if-changed lib/

    - name: Verify required secrets
      run: |
        if [ -z "$SUPABASE_ANON_KEY" ]; then
          echo "ERROR: SUPABASE_ANON_KEY secret is not set. Google OAuth will fail silently."
          exit 1
        fi
      env:
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    - name: Build web
      run: flutter build web --release --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

    - name: Copy build output to public/
      run: |
        rm -rf public
        cp -r build/web public

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Deploy to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: team_1ODbUjfrBlWhqRwWgQDUVHxR
        VERCEL_PROJECT_ID: prj_sqBTPacjbRKZuop1ZZL4qOhThZC4
      run: |
        npx vercel --prod --token "$VERCEL_TOKEN" --yes

