name: 장전 국내 시세 탐색

# 조회만 하는 격리 워크플로우 — 메일 발송·DB 쓰기·주문 없음.
# 08:35 아침 메일에 쓸 국내 장전 정보(선물·현물 동시호가 예상체결가, NXT 프리마켓)가
# 실제로 어떤 필드로 내려오는지 확인한다. 평일 KST 08:35 전후에 실행할 것.
# 답이 나오면 이 워크플로우는 지울 것 (임시 탐색용).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: trading/requirements.txt

      - name: 패키지 설치
        run: pip install -r trading/requirements.txt

      - name: 장전 국내 시세 원본 확인
        env:
          KIS_APP_KEY:           ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:        ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:        ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_PROD_CODE: ${{ secrets.KIS_ACCOUNT_PROD_CODE }}
        run: |
          cd trading
          python probe_preopen_kr.py
