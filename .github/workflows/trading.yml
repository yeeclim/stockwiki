name: 자동매매

on:
  schedule:
    # 평일 KST 09:00~15:00 — 30분 간격, 딜레이 감안해 UTC 0~6시 커버
    - cron: '0,30 0,1,2,3,4,5,6 * * 1-5'
  workflow_dispatch:  # 수동 실행 (테스트용)
    inputs:
      dry_run:
        description: 'Dry run - simulate orders without placing them (true/false)'
        required: false
        default: 'false'

# 스케줄 지연으로 두 실행이 겹치면 같은 종목을 중복 매수할 수 있다 — 한 번에 하나만.
concurrency:
  group: auto-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DRY_RUN: ${{ github.event.inputs.dry_run }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: trading/requirements.txt

      - name: 패키지 설치
        run: pip install -r trading/requirements.txt

      - name: KIS API 연결 확인
        run: |
          echo "🔍 GitHub Actions runner IP:"
          curl -s https://api.ipify.org
          echo ""
          echo "🔍 KIS API 포트 연결 테스트 (5초 타임아웃):"
          timeout 5 bash -c 'echo > /dev/tcp/openapi.koreainvestment.com/9443' && echo "✅ 포트 열려 있음" || echo "❌ 포트 연결 실패 (방화벽 차단 가능성)"

      - name: 자동매매 실행
        env:
          KIS_APP_KEY:              ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:           ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:           ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_PROD_CODE:    ${{ secrets.KIS_ACCOUNT_PROD_CODE }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # trading_configs 의 KIS 자격증명 복호화 (trading/config_crypto.py).
          # 없으면 모든 사용자가 복호화 실패로 건너뛰어진다.
          TRADING_ENC_KEY:          ${{ secrets.TRADING_ENC_KEY }}
          KAKAO_REST_API_KEY:       ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN:      ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET:      ${{ secrets.KAKAO_CLIENT_SECRET }}
          EMAIL_SENDER:             ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:           ${{ secrets.EMAIL_PASSWORD }}
          DART_API_KEY:             ${{ secrets.DART_API_KEY }}
        run: |
          cd trading
          python main.py

      - name: Supabase 활성 유지 (keep-alive)
        if: always()
        env:
          # /api/* 는 자사 도메인 외 호출을 403 으로 막으므로 CI 는 API 키로 통과한다.
          # Vercel 환경변수 API_KEYS 에 넣은 값 중 하나를 GitHub Secrets 에 동일하게 등록할 것.
          STOCKWIKI_API_KEY: ${{ secrets.STOCKWIKI_API_KEY }}
        run: |
          curl -s -H "X-API-Key: $STOCKWIKI_API_KEY" "https://stockwiki.vercel.app/api/board?page=1&limit=1" > /dev/null
          echo "✅ Supabase ping 완료"
