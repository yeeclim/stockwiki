name: 자동매매

on:
  schedule:
    # 프리마켓  KST 08:00~09:00 = UTC 23:00 (전날 일~목)
    - cron: '*/5 23 * * 0-4'
    # 정규장    KST 09:00~15:30 = UTC 00:00~06:30
    # 포스트마켓 KST 15:40~15:59 = UTC 06:40~06:59 (위 범위에 포함)
    - cron: '*/5 0-6 * * 1-5'
    # 포스트마켓 KST 16:00~20:00 = UTC 07:00~11:00
    - cron: '*/5 7-10 * * 1-5'
  workflow_dispatch:  # 수동 실행 (테스트용)
    inputs:
      dry_run:
        description: 'Dry run - simulate orders without placing them (true/false)'
        required: false
        default: 'false'

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DRY_RUN: ${{ github.event.inputs.dry_run }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: trading/requirements.txt

      - name: 패키지 설치
        run: pip install -r trading/requirements.txt

      - name: KIS API 연결 확인
        run: |
          echo "🔍 GitHub Actions runner IP:"
          curl -s https://api.ipify.org
          echo ""
          echo "🔍 KIS API 포트 연결 테스트 (5초 타임아웃):"
          timeout 5 bash -c 'echo > /dev/tcp/openapi.koreainvestment.com/9443' && echo "✅ 포트 열려 있음" || echo "❌ 포트 연결 실패 (방화벽 차단 가능성)"

      - name: 자동매매 실행
        env:
          KIS_APP_KEY:              ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:           ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:           ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_PROD_CODE:    ${{ secrets.KIS_ACCOUNT_PROD_CODE }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KAKAO_REST_API_KEY:       ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN:      ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET:      ${{ secrets.KAKAO_CLIENT_SECRET }}
          EMAIL_SENDER:             ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:           ${{ secrets.EMAIL_PASSWORD }}
        run: |
          cd trading
          python main.py

      - name: Supabase 활성 유지 (keep-alive)
        if: always()
        run: |
          curl -s "https://stockwiki.vercel.app/api/board?page=1&limit=1" > /dev/null
          echo "✅ Supabase ping 완료"
