name: 시장 신호 장중 체크포인트

# 06:30 장전 판정과 같은 신호 로직을 장중에 다시 돌려 적중률 로그에 'mid' 행으로 남긴다.
# 메일·게시판 발송 없음 — 기록만 한다. (trading/INTRADAY_SIGNAL_PLAN.md 3-1)
on:
  schedule:
    # 평일 KST 11:00 = UTC 02:00. Actions 지연으로 늦어져도 실제 판정 시각(recorded_at)과
    # 그 시점 지수 레벨을 같이 남기므로 채점은 정확하다. 15시 이후로 밀리면 기록을 건너뛴다.
    - cron: '0 2 * * 1-5'
  workflow_dispatch:

concurrency:
  group: forecast-checkpoint
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: trading/requirements.txt

      - name: 패키지 설치
        run: pip install -r trading/requirements.txt

      - name: 장중 재판정 기록
        env:
          KIS_APP_KEY:               ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:            ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:            ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_PROD_CODE:     ${{ secrets.KIS_ACCOUNT_PROD_CODE }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd trading
          python forecast_log.py checkpoint
