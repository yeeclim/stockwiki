<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #39FF8C; } a:hover { color: #2FE07A; }
  </style>
</helmet>
<div style="position: relative; width: 1200px; height: 630px; background: #050706; overflow: hidden; font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;">

  <div style="position: absolute; inset: 0; background-image: linear-gradient(#0d1712 1px, transparent 1px), linear-gradient(90deg, #0d1712 1px, transparent 1px); background-size: 46px 46px; opacity: 0.55;"></div>
  <div style="position: absolute; left: 50%; top: 52%; width: 900px; height: 620px; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(57,255,140,0.13), rgba(57,255,140,0) 70%);"></div>

  <!-- center wordmark -->
  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 20px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="width: 16px; height: 16px; border-radius: 50%; background: #FF4550; box-shadow: 0 0 16px rgba(255,69,80,0.85);"></span>
      <span style="font-weight: 800; font-size: 68px; letter-spacing: 8px; color: #EEF4EF;">STOCKWIKI</span>
    </div>
    <div style="width: 200px; height: 3px; background: #39FF8C; box-shadow: 0 0 18px rgba(57,255,140,0.65);"></div>
  </div>

  <!-- bottom ticker strip -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: rgba(8,12,10,0.85); border-top: 1px solid #182620; display: flex; align-items: center; justify-content: center; gap: 34px; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; color: #6C7A71; letter-spacing: 0.4px;">
    <span>KOSPI <span style="color: #EEF4EF;">2,680</span> <span style="color: #FF4550;">&#9650;</span></span>
    <span>USD/KRW <span style="color: #EEF4EF;">1,382</span> <span style="color: #FF4550;">&#9650;</span></span>
    <span>NASDAQ <span style="color: #EEF4EF;">19,540</span> <span style="color: #3B82F6;">&#9660;</span></span>
    <span>BTC <span style="color: #EEF4EF;">96,240</span> <span style="color: #FF4550;">&#9650;</span></span>
  </div>
</div>
</x-dc>
</body>
</html>
