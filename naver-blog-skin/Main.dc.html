<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #39FF8C; } a:hover { color: #2FE07A; }
  </style>
</helmet>
<div style="position: relative; width: 1920px; height: 500px; background: #050706; overflow: hidden; font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;">

  <!-- terminal grid -->
  <div style="position: absolute; inset: 0; background-image: linear-gradient(#0d1712 1px, transparent 1px), linear-gradient(90deg, #0d1712 1px, transparent 1px); background-size: 48px 48px; opacity: 0.55;"></div>

  <!-- center glow -->
  <div style="position: absolute; left: 50%; top: 56%; width: 1300px; height: 640px; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(57,255,140,0.10), rgba(57,255,140,0) 70%);"></div>

  <!-- 상단 ~48px는 네이버 블로그 메뉴(이웃블로그·블로그홈·내메뉴) 자리 → 비워둠 -->

  <!-- 티커 리본: 네이버 메뉴 아래로 내림 (top 60px) -->
  <div style="position: absolute; left: 0; right: 0; top: 60px; height: 34px; background: rgba(8,12,10,0.75); border-top: 1px solid #182620; border-bottom: 1px solid #182620; display: flex; align-items: center; gap: 30px; padding: 0 44px; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; color: #6C7A71; letter-spacing: 0.4px; white-space: nowrap; overflow: hidden;">
    <span>KOSPI <span style="color: #EEF4EF;">2,680.4</span> <span style="color: #FF4550;">&#9650; 0.42%</span></span>
    <span>KOSDAQ <span style="color: #EEF4EF;">870.1</span> <span style="color: #3B82F6;">&#9660; 0.19%</span></span>
    <span>USD/KRW <span style="color: #EEF4EF;">1,382</span> <span style="color: #FF4550;">&#9650; 0.11%</span></span>
    <span>S&amp;P 500 <span style="color: #EEF4EF;">6,012</span> <span style="color: #FF4550;">&#9650; 0.33%</span></span>
    <span>NASDAQ <span style="color: #EEF4EF;">19,540</span> <span style="color: #3B82F6;">&#9660; 0.08%</span></span>
    <span>BTC <span style="color: #EEF4EF;">96,240</span> <span style="color: #FF4550;">&#9650; 2.10%</span></span>
    <span>GOLD <span style="color: #EEF4EF;">2,655</span> <span style="color: #FF4550;">&#9650; 0.24%</span></span>
    <span>WTI <span style="color: #EEF4EF;">71.8</span> <span style="color: #3B82F6;">&#9660; 0.55%</span></span>
  </div>

  <!-- 966px 콘텐츠 안전영역 가이드 (은은하게) -->
  <div style="position: absolute; left: 50%; top: 108px; bottom: 58px; width: 966px; transform: translateX(-50%); border-left: 1px dashed rgba(108,122,113,0.16); border-right: 1px dashed rgba(108,122,113,0.16);"></div>

  <!-- 하단 액센트 헤어라인 — Naver 카테고리 메뉴 위쪽에 오도록 44px 띄움 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 44px; height: 2px; background: linear-gradient(90deg, transparent, rgba(57,255,140,0.55) 18%, rgba(57,255,140,0.55) 82%, transparent); box-shadow: 0 0 18px rgba(57,255,140,0.4);"></div>

</div>
</x-dc>
</body>
</html>
