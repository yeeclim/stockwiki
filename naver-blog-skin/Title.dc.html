<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #39FF8C; } a:hover { color: #2FE07A; }
  </style>
</helmet>
<div style="position: relative; width: 966px; height: 200px; background: #050706; overflow: hidden; font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;">
  <!-- context grid (배경 이미지가 담당하는 부분 — 타이틀 파일에는 넣지 않음) -->
  <div style="position: absolute; inset: 0; background-image: linear-gradient(#0d1712 1px, transparent 1px), linear-gradient(90deg, #0d1712 1px, transparent 1px); background-size: 48px 48px; opacity: 0.5;"></div>
  <div style="position: absolute; left: 50%; top: 60%; width: 640px; height: 320px; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(57,255,140,0.12), rgba(57,255,140,0) 70%);"></div>

  <!-- ↓ 타이틀 이미지(투명 PNG)로 올라가는 부분 -->
  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF4550; box-shadow: 0 0 12px rgba(255,69,80,0.85);"></span>
      <span style="font-weight: 800; font-size: 40px; letter-spacing: 6px; color: #EEF4EF; text-shadow: 0 1px 6px rgba(5,7,6,0.55);">STOCKWIKI</span>
    </div>
    <div style="width: 150px; height: 2px; background: #39FF8C; box-shadow: 0 0 14px rgba(57,255,140,0.7);"></div>
  </div>
</div>
</x-dc>
</body>
</html>
