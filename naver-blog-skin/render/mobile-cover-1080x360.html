<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>html,body{margin:0;padding:0;}</style>
</head>
<body>
<div style="position: relative; width: 1080px; height: 360px; background: #050706; overflow: hidden; font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;">
  <div style="position: absolute; inset: 0; background-image: linear-gradient(#0d1712 1px, transparent 1px), linear-gradient(90deg, #0d1712 1px, transparent 1px); background-size: 44px 44px; opacity: 0.5;"></div>
  <div style="position: absolute; left: 50%; top: 55%; width: 760px; height: 420px; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(57,255,140,0.12), rgba(57,255,140,0) 70%);"></div>
  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 13px;">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF4550; box-shadow: 0 0 12px rgba(255,69,80,0.8);"></span>
      <span style="font-weight: 800; font-size: 40px; letter-spacing: 5px; color: #EEF4EF;">STOCKWIKI</span>
    </div>
    <div style="width: 150px; height: 2px; background: #39FF8C; box-shadow: 0 0 14px rgba(57,255,140,0.6);"></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(57,255,140,0.55) 25%, rgba(57,255,140,0.55) 75%, transparent); box-shadow: 0 0 16px rgba(57,255,140,0.4);"></div>
</div>
</body>
</html>
