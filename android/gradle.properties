# 이 PC 는 물리 RAM 이 16GB 다. 이전 설정(-Xmx8G + MaxMetaspaceSize=4G)은 Gradle
# 데몬 하나가 12GB 넘게 요구해서, Kotlin 데몬·크롬과 겹치면 네이티브 malloc 이
# 실패하고 JVM 이 통째로 죽었다(hs_err_pid*.log, arena.cpp:189).
# Flutter 안드로이드 빌드는 힙 3GB, 메타스페이스 1GB 면 충분하다.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Kotlin 컴파일러는 Gradle 과 별개인 JVM 으로 뜬다. 여기서 안 잡으면
# 기본값대로 크게 잡아서 위 설정을 아무리 줄여도 소용이 없다.
kotlin.daemon.jvmargs=-Xmx1G

# 워커를 늘리면 메모리가 그만큼 배로 든다. 8코어지만 병목은 RAM 이다.
org.gradle.workers.max=2
org.gradle.parallel=false

# 기본 3시간은 너무 길다. 안 쓰는 데몬이 계속 RAM 을 물고 있었다.
org.gradle.daemon.idletimeout=1800000

android.useAndroidX=true
android.enableJetifier=true
